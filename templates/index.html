<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resolver Problema</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #6200ff, #2600ff);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #0072ff;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .btn {
            background-color: #00c6ff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #0072ff;
        }

        h2 {
            margin-top: 30px;
            color: #0072ff;
        }

        p {
            background-color: #f1f1f1;
            padding: 15px;
            border-radius: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Resolver Problema</h1>
        <form method="post">
            <div class="form-group">
                <label for="estado_inicial">Estado Inicial:</label>
                <input type="text" name="estado_inicial" id="estado_inicial" required>
            </div>
            <div class="form-group">
                <label for="estado_final">Estado Final:</label>
                <input type="text" name="estado_final" id="estado_final" required>
            </div>
            <button type="submit" class="btn">Resolver</button>
        </form>

        {% if camino %}
            <h2>Camino encontrado:</h2>
            <p>{{ camino }}</p>
        {% endif %}
    </div>
</body>
</html>
